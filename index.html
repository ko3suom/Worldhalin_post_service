<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="택배접수">
<title>택배 접수 · 라벨 출력</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230f172a'/%3E%3Crect x='30' y='42' width='120' height='96' fill='%23fbbf24'/%3E%3Crect x='84' y='42' width='12' height='96' fill='%230f172a'/%3E%3Crect x='30' y='84' width='120' height='12' fill='%230f172a'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
  background:#e9edf2;color:#0f172a;
  padding:0 16px calc(40px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:30px;font-weight:900;letter-spacing:-.5px;margin:0}
h2{font-size:18px;font-weight:800;margin:0}
.sub{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#64748b;letter-spacing:1.5px;margin-top:4px}
header{padding:24px 0 4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.card{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:20px;margin-bottom:18px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:2px;background:#0f172a;color:#fff;padding:4px 8px;border-radius:3px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:5px}
input[type=text]{
  width:100%;height:50px;padding:0 12px;font-size:17px;border:1px solid #cbd5e1;
  border-radius:7px;background:#fff;font-family:inherit;color:#0f172a
}
input:focus{outline:none;border-color:#0f172a;box-shadow:0 0 0 3px rgba(15,23,42,.15)}
input.bad{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{height:44px;padding:0 18px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;
  font-size:14px;font-weight:700;font-family:inherit;color:#334155}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.cbtn{height:42px;padding:0 14px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;
  font-size:14px;font-weight:700;font-family:inherit;color:#475569;margin:0 8px 8px 0}
.cbtn.on{background:#fbbf24;border-color:#f59e0b;color:#0f172a}
.tape{height:16px;background:repeating-linear-gradient(45deg,#111 0 10px,#fbbf24 10px 20px);
  margin:-20px -20px 18px}
.consent{font-size:16px;line-height:1.65;color:#334155;background:#f8fafc;
  border:1px solid #e2e8f0;border-radius:7px;padding:14px}
.agree{width:100%;min-height:60px;margin-top:16px;padding:12px 16px;border-radius:8px;
  border:2px solid #cbd5e1;background:#fff;display:flex;align-items:center;gap:12px;
  font-size:16px;font-weight:800;font-family:inherit;color:#1e293b;text-align:left}
.agree.on{background:#0f172a;color:#fff;border-color:#0f172a}
.agree.bad{border-color:#dc2626}
.box{flex:0 0 28px;width:28px;height:28px;border:2px solid #94a3b8;border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.agree.on .box{background:#fbbf24;border-color:#fbbf24;color:#0f172a}
#sig{width:100%;height:170px;background:#fff;border:2px dashed #cbd5e1;border-radius:7px;touch-action:none;display:block}
#sig.bad{border-color:#dc2626}
.mini{height:38px;padding:0 12px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;
  font-size:13px;font-weight:700;font-family:inherit;color:#475569}
.big{width:100%;height:66px;border-radius:10px;border:none;background:#0f172a;color:#fff;
  font-size:19px;font-weight:900;font-family:inherit;margin-bottom:12px}
.half{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.half button{height:56px;border-radius:10px;font-size:16px;font-weight:800;font-family:inherit;background:#fff}
#saveBtn{border:2px solid #0f172a;color:#0f172a}
#resetBtn{border:1px solid #cbd5e1;color:#64748b}
.rec{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid #e2e8f0}
.rec .t{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#64748b;width:120px;flex:0 0 auto}
.rec .m{flex:1 1 180px}
.rec .m b{font-size:15px}
.rec .m div{font-size:13px;color:#64748b;margin-top:2px}
.rec button{height:44px;width:52px;border-radius:7px;border:1px solid #cbd5e1;background:#fff;
  font-size:17px;font-family:inherit;margin-left:8px}
.rec .del{color:#dc2626}
.rec .del.arm{background:#dc2626;color:#fff;border-color:#dc2626}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;
  align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
#modal.on{display:flex}
.sheet{background:#e2e8f0;border-radius:14px;padding:14px;max-height:100%;overflow:auto}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet .bar button{height:50px;border-radius:8px;font-size:16px;font-weight:800;font-family:inherit;border:none}
#doPrint{background:#0f172a;color:#fff;padding:0 22px}
#closeM{background:#fff;border:1px solid #cbd5e1;width:50px;font-size:20px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:14px 22px;border-radius:999px;font-size:14px;font-weight:800;z-index:60;display:none;max-width:90%}
.empty{color:#94a3b8;font-size:14px;padding:16px 0}
#printArea{display:none}
@media (max-width:700px){.grid2,.grid4{grid-template-columns:1fr}}
@page{size:100mm 150mm;margin:0}
@media print{
  body{margin:0;padding:0;background:#fff}
  #app,#modal,#toast{display:none!important}
  #printArea{display:block!important}
}
</style>
</head>
<body>

<div id="app" class="wrap">
  <header>
    <div class="row">
      <div>
        <h1 id="ttl">택배 접수</h1>
        <div class="sub">BIXOLON SRP-770II · 100×150mm LABEL</div>
      </div>
      <button class="mini" style="height:46px" onclick="document.getElementById('stcard').hidden=!document.getElementById('stcard').hidden">⚙︎ 매장 정보</button>
    </div>
    <div class="chips" id="langs"></div>
  </header>

  <div class="card" id="stcard" hidden>
    <div class="grid2">
      <label class="f"><span>매장명 (라벨 상단)</span><input type="text" id="storeName" placeholder="예) ○○상회 택배접수"></label>
      <label class="f"><span>매장 전화 (라벨 하단)</span><input type="text" id="storePhone" placeholder="예) 02-000-0000"></label>
    </div>
  </div>

  <div class="card">
    <div class="head"><span class="eyebrow">FROM</span><h2 data-t="sender"></h2></div>
    <div class="grid2">
      <label class="f"><span data-t="name"></span><input type="text" id="senderName"></label>
      <label class="f"><span data-t="phone"></span><input type="text" id="senderPhone" placeholder="010-0000-0000"></label>
    </div>
    <label class="f"><span data-t="address"></span><input type="text" id="senderAddr"></label>
  </div>

  <div class="card">
    <div class="head"><span class="eyebrow">TO</span><h2 data-t="receiver"></h2></div>
    <label class="f"><span data-t="country"></span></label>
    <div id="countries"></div>
    <input type="text" id="recvCountry" placeholder="Country" style="margin-bottom:14px">
    <div class="grid2">
      <label class="f"><span data-t="name"></span><input type="text" id="recvName"></label>
      <label class="f"><span data-t="phone"></span><input type="text" id="recvPhone"></label>
    </div>
    <label class="f"><span data-t="address"></span><input type="text" id="recvAddr"></label>
  </div>

  <div class="card">
    <div class="head"><span class="eyebrow">ITEM</span><h2 data-t="pkg"></h2></div>
    <div class="grid4">
      <label class="f"><span data-t="contents"></span><input type="text" id="contents"></label>
      <label class="f"><span data-t="qty"></span><input type="text" id="qty" inputmode="numeric" value="1"></label>
      <label class="f"><span data-t="weight"></span><input type="text" id="weight" inputmode="decimal"></label>
    </div>
  </div>

  <div class="card">
    <div class="tape"></div>
    <h2 data-t="consentTitle" style="margin-bottom:10px"></h2>
    <p class="consent" id="consentText"></p>
    <button class="agree" id="agreeBtn"><span class="box" id="agreeBox"></span><span data-t="agree"></span></button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px">
      <span style="font-size:13px;font-weight:700;color:#475569" data-t="signature"></span>
      <button class="mini" id="clearSig" data-t="clear"></button>
    </div>
    <canvas id="sig"></canvas>
  </div>

  <button class="big" id="printBtn"></button>
  <div class="half">
    <button id="saveBtn"></button>
    <button id="resetBtn"></button>
  </div>

  <div class="card" style="margin-top:24px">
    <div class="head"><span class="eyebrow">LOG</span><h2 data-t="records"></h2><span id="cnt" style="color:#64748b;font-size:14px"></span></div>
    <div id="recs"></div>
  </div>
</div>

<div id="modal">
  <div class="sheet">
    <div class="bar">
      <span style="font-family:ui-monospace,monospace;font-weight:800" id="mid"></span>
      <div><button id="doPrint"></button><button id="closeM">✕</button></div>
    </div>
    <div id="prev" style="box-shadow:0 8px 30px rgba(0,0,0,.3)"></div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

si:{title:"පාර්සල් භාරගැනීම",sender:"යවන්නා",receiver:"ලබන්නා",name:"නම",phone:"දුරකථන",address:"ලිපිනය",country:"රට",pkg:"පාර්සල් තොරතුරු",contents:"අන්තර්ගතය",qty:"ප්‍රමාණය",weight:"බර (kg)",consentTitle:"හානි වගකීම් නිදහස් එකඟතාව",consentText:"ඉහත පාර්සල් තොරතුරු නිවැරදි බව මම තහවුරු කරමි. ප්‍රවාහනයේදී බිඳෙනසුලු භාණ්ඩවලට (වීදුරු, පිඟන් ආදිය) සිදුවන හානි හෝ ප්‍රමාණවත් නොවන ඇසුරුම් නිසා සිදුවන හානි සම්බන්ධයෙන් වෙළඳසැල සහ ප්‍රවාහන සමාගම වගකීම් නොදරන බවට මම එකඟ වෙමි.",agree:"මම එකඟ වෙමි",signature:"අත්සන",clear:"මකන්න",print:"ලේබලය මුද්‍රණය",save:"සුරකින්න",reset:"අලුත්",records:"වාර්තා",noRecords:"වාර්තා නැත",required:"අවශ්‍ය තොරතුරු පුරවා, එකඟ වී අත්සන් කරන්න",saved:"සුරකින ලදී"},
my:{title:"ပါဆယ်လက်ခံခြင်း",sender:"ပေးပို့သူ",receiver:"လက်ခံသူ",name:"အမည်",phone:"ဖုန်း",address:"လိပ်စာ",country:"နိုင်ငံ",pkg:"ပါဆယ်အချက်အလက်",contents:"ပါဝင်ပစ္စည်း",qty:"အရေအတွက်",weight:"အလေးချိန် (kg)",consentTitle:"ပျက်စီးမှုသဘောတူညီချက်",consentText:"အထက်ပါ ပါဆယ်အချက်အလက်များ မှန်ကန်ကြောင်း အတည်ပြုပါသည်။ သယ်ယူပို့ဆောင်စဉ် ကွဲရှလွယ်သောပစ္စည်းများ (ဖန်၊ ကြွေထည် စသည်) ပျက်စီးမှု သို့မဟုတ် ထုပ်ပိုးမှုမလုံလောက်ခြင်းကြောင့် ဖြစ်ပေါ်သော ပျက်စီးမှုအတွက် ဆိုင်နှင့် သယ်ယူပို့ဆောင်ရေးကုမ္ပဏီတွင် တာဝန်မရှိကြောင်း သဘောတူပါသည်။",agree:"သဘောတူပါသည်",signature:"လက်မှတ်",clear:"ဖျက်ရန်",print:"တံဆိပ်ထုတ်ရန်",save:"သိမ်းရန်",reset:"အသစ်",records:"မှတ်တမ်း",noRecords:"မှတ်တမ်းမရှိပါ",required:"လိုအပ်သည်များဖြည့်ပြီး သဘောတူကာ လက်မှတ်ထိုးပါ",saved:"သိမ်းပြီး"}};

var $=function(id){return document.getElementById(id)};
var lang="ko", agreed=false, hasInk=false, tried=false, recs=[], cur=null, armed=null;
var FIELDS=["senderName","senderPhone","senderAddr","recvName","recvPhone","recvCountry","recvAddr","contents","qty","weight"];
var REQ=["senderName","senderPhone","recvName","recvCountry","recvAddr","contents"];

/* ── 저장소 ── */
function load(){
  try{recs=JSON.parse(localStorage.getItem("parcel.recs")||"[]")}catch(e){recs=[]}
  try{var s=JSON.parse(localStorage.getItem("parcel.store")||"{}");
    $("storeName").value=s.name||"";$("storePhone").value=s.phone||""}catch(e){}
}
function saveRecs(){try{localStorage.setItem("parcel.recs",JSON.stringify(recs.slice(0,400)))}catch(e){toast("저장 공간 부족")}}
function saveStore(){try{localStorage.setItem("parcel.store",JSON.stringify({name:$("storeName").value,phone:$("storePhone").value}))}catch(e){}}
$("storeName").oninput=saveStore;$("storePhone").oninput=saveStore;

/* ── 언어 적용 ── */
function applyLang(){
  var t=T[lang];
  $("ttl").textContent=t.title;
  document.title=t.title+" · 라벨 출력";
  var ns=document.querySelectorAll("[data-t]");
  for(var i=0;i<ns.length;i++) ns[i].textContent=t[ns[i].getAttribute("data-t")];
  $("consentText").textContent=t.consentText;
  $("printBtn").textContent="🖨  "+t.print;
  $("saveBtn").textContent=t.save;
  $("resetBtn").textContent=t.reset;
  $("doPrint").textContent=t.print;
  var cs=$("langs").children;
  for(var j=0;j<cs.length;j++) cs[j].className="chip"+(cs[j].dataset.c===lang?" on":"");
  renderRecs();
}
LANGS.forEach(function(l){
  var b=document.createElement("button");b.className="chip";b.textContent=l[1];b.dataset.c=l[0];
  b.onclick=function(){lang=l[0];
    if(!$("recvCountry").value&&LC[l[0]]){$("recvCountry").value=LC[l[0]];paintCountries()}
    applyLang()};
  $("langs").appendChild(b)});

/* ── 국가 버튼 ── */
COUNTRIES.forEach(function(c){
  var b=document.createElement("button");b.className="cbtn";b.textContent=c;b.dataset.c=c;
  b.onclick=function(){$("recvCountry").value=c;paintCountries();mark()};
  $("countries").appendChild(b)});
function paintCountries(){
  var cs=$("countries").children,v=$("recvCountry").value;
  for(var i=0;i<cs.length;i++) cs[i].className="cbtn"+(cs[i].dataset.c===v?" on":"")}
$("recvCountry").oninput=function(){paintCountries();mark()};

/* ── 서명 패드 ── */
var cv=$("sig"),cx=cv.getContext("2d"),drawing=false;
function sizeCanvas(){
  var d=window.devicePixelRatio||1,img=null;
  if(hasInk){img=new Image();img.src=cv.toDataURL()}
  cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;
  cx.setTransform(d,0,0,d,0,0);cx.lineWidth=2.6;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle="#111827";
}
sizeCanvas();window.addEventListener("orientationchange",function(){setTimeout(sizeCanvas,300)});
function pt(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener("pointerdown",function(e){e.preventDefault();drawing=true;var p=pt(e);cx.beginPath();cx.moveTo(p[0],p[1]);cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",function(e){if(!drawing)return;e.preventDefault();var p=pt(e);cx.lineTo(p[0],p[1]);cx.stroke();hasInk=true;cv.classList.remove("bad")});
cv.addEventListener("pointerup",function(){drawing=false});
cv.addEventListener("pointercancel",function(){drawing=false});
$("clearSig").onclick=function(){cx.clearRect(0,0,cv.width,cv.height);hasInk=false};
function sigPNG(){
  if(!hasInk)return null;
  var o=document.createElement("canvas");o.width=440;o.height=Math.round(cv.height/cv.width*440);
  o.getContext("2d").drawImage(cv,0,0,o.width,o.height);return o.toDataURL("image/png")}

/* ── 동의 ── */
$("agreeBtn").onclick=function(){agreed=!agreed;
  this.className="agree"+(agreed?" on":"");$("agreeBox").textContent=agreed?"✓":""};

/* ── 검증 ── */
function mark(){
  if(!tried)return;
  REQ.forEach(function(k){$(k).className=$(k).value.trim()?"":"bad"});
  $("agreeBtn").className="agree"+(agreed?" on":" bad");
  cv.className=hasInk?"":"bad"}
FIELDS.forEach(function(k){$(k).addEventListener("input",mark)});
function valid(){
  for(var i=0;i<REQ.length;i++) if(!$(REQ[i]).value.trim())return false;
  return agreed&&hasInk}

/* ── 유틸 ── */
function p2(n){return n<10?"0"+n:""+n}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fdate(ts){var d=new Date(ts);return d.getFullYear()+"."+p2(d.getMonth()+1)+"."+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function toast(m){var e=$("toast");e.textContent=m;e.style.display="block";setTimeout(function(){e.style.display="none"},2000)}

/* ── 라벨 HTML (100×150mm) ── */
function labelHTML(r){
  var bx="border:.5mm solid #000",
      eb="font-family:ui-monospace,monospace;font-size:3mm;letter-spacing:.8mm;background:#000;color:#fff;padding:.8mm 2mm;display:inline-block",
      st=$("storeName").value||"택배 접수",ph=$("storePhone").value||"";
  var ln=(LANGS.filter(function(l){return l[0]===r.lang})[0]||["","-"])[1];
  return '<div style="width:100mm;height:150mm;background:#fff;color:#000;padding:4mm;box-sizing:border-box;'+
  'display:flex;flex-direction:column;gap:2.5mm;font-family:-apple-system,\'Apple SD Gothic Neo\',sans-serif">'+
  '<div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:.8mm solid #000;padding-bottom:1.5mm">'+
    '<div style="font-size:5mm;font-weight:800">'+esc(st)+'</div>'+
    '<div style="font-family:ui-monospace,monospace;font-size:3.4mm;font-weight:700">No. '+esc(r.id)+'</div></div>'+
  '<div style="'+bx+';padding:2mm"><span style="'+eb+'">FROM · 보내는 분</span>'+
    '<div style="font-size:4.2mm;font-weight:700;margin-top:1.2mm">'+esc(r.senderName)+' <span style="font-weight:500">'+esc(r.senderPhone)+'</span></div>'+
    '<div style="font-size:3.4mm;margin-top:.6mm;line-height:1.35">'+esc(r.senderAddr)+'</div></div>'+
  '<div style="border:.9mm solid #000;padding:2.5mm;flex-grow:1"><span style="'+eb+'">TO · 받는 분</span>'+
    '<div style="font-size:7.5mm;font-weight:900;margin-top:1.5mm;text-transform:uppercase;letter-spacing:.3mm">'+esc(r.recvCountry)+'</div>'+
    '<div style="font-size:5.2mm;font-weight:800;margin-top:1mm">'+esc(r.recvName)+'</div>'+
    '<div style="font-size:4.2mm;font-weight:600">'+esc(r.recvPhone)+'</div>'+
    '<div style="font-size:3.8mm;margin-top:1.2mm;line-height:1.4">'+esc(r.recvAddr)+'</div></div>'+
  '<div style="display:flex;gap:2mm">'+
    '<div style="'+bx+';padding:1.5mm 2mm;flex-grow:1"><div style="font-size:2.8mm;font-weight:700">내용물 CONTENTS</div>'+
      '<div style="font-size:3.8mm;font-weight:600">'+esc(r.contents)+'</div></div>'+
    '<div style="'+bx+';padding:1.5mm 2mm;width:16mm;text-align:center"><div style="font-size:2.8mm;font-weight:700">수량</div>'+
      '<div style="font-size:4.2mm;font-weight:700">'+esc(r.qty)+'</div></div>'+
    '<div style="'+bx+';padding:1.5mm 2mm;width:20mm;text-align:center"><div style="font-size:2.8mm;font-weight:700">무게 kg</div>'+
      '<div style="font-size:4.2mm;font-weight:700">'+esc(r.weight||"-")+'</div></div></div>'+
  '<div style="'+bx+';padding:1.5mm 2mm;display:flex;align-items:center;gap:2mm">'+
    '<div style="flex-grow:1"><div style="font-size:3.2mm;font-weight:800">☑ 파손면책 동의 · DAMAGE WAIVER AGREED</div>'+
    '<div style="font-size:2.8mm;margin-top:.5mm">동의 언어: '+esc(ln)+' · '+fdate(r.ts)+'</div></div>'+
    (r.sig?'<img src="'+r.sig+'" style="height:11mm;max-width:34mm;object-fit:contain">':'')+'</div>'+
  '<div style="display:flex;justify-content:space-between;font-size:2.8mm;font-family:ui-monospace,monospace">'+
    '<span>'+esc(ph)+'</span><span>SRP-770II · 100×150mm</span></div></div>'}

/* ── 접수 내역 ── */
function renderRecs(){
  $("cnt").textContent=recs.length?recs.length:"";
  if(!recs.length){$("recs").innerHTML='<p class="empty">'+esc(T[lang].noRecords)+'</p>';return}
  var h="";
  recs.forEach(function(r,i){
    h+='<div class="rec"><div class="t">'+fdate(r.ts)+'</div><div class="m"><b>'+esc(r.senderName)+' → '+esc(r.recvName)+
    '</b><div>'+esc(r.recvCountry)+' · '+esc(r.contents)+' ×'+esc(r.qty)+'</div></div><div>'+
    '<button onclick="openPrev('+i+')">🖨</button><button onclick="loadRec('+i+')">↥</button>'+
    '<button class="del'+(armed===i?" arm":"")+'" onclick="delRec('+i+')">🗑</button></div></div>'});
  $("recs").innerHTML=h}

function openPrev(i){cur=recs[i];$("mid").textContent="No. "+cur.id;
  $("prev").innerHTML=labelHTML(cur);$("printArea").innerHTML=labelHTML(cur);$("modal").className="on"}
function loadRec(i){var r=recs[i];
  FIELDS.forEach(function(k){$(k).value=r[k]||""});
  agreed=false;hasInk=false;tried=false;
  $("agreeBtn").className="agree";$("agreeBox").textContent="";
  cx.clearRect(0,0,cv.width,cv.height);cv.className="";
  REQ.forEach(function(k){$(k).className=""});
  paintCountries();window.scrollTo({top:0,behavior:"smooth"})}
function delRec(i){
  if(armed!==i){armed=i;renderRecs();setTimeout(function(){if(armed===i){armed=null;renderRecs()}},2600);return}
  recs.splice(i,1);armed=null;saveRecs();renderRecs()}

/* ── 저장 / 출력 ── */
function commit(open){
  tried=true;mark();
  if(!valid()){toast(T[lang].required);return}
  var d=new Date(),r={id:String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate())+"-"+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds()),
    ts:d.getTime(),lang:lang,sig:sigPNG()};
  FIELDS.forEach(function(k){r[k]=$(k).value.trim()});
  recs.unshift(r);saveRecs();renderRecs();
  if(open){openPrev(0)}else{toast(T[lang].saved)}}
$("printBtn").onclick=function(){commit(true)};
$("saveBtn").onclick=function(){commit(false)};
$("resetBtn").onclick=function(){
  FIELDS.forEach(function(k){$(k).value="";$(k).className=""});$("qty").value="1";
  agreed=false;hasInk=false;tried=false;
  $("agreeBtn").className="agree";$("agreeBox").textContent="";
  cx.clearRect(0,0,cv.width,cv.height);cv.className="";paintCountries()};
$("closeM").onclick=function(){$("modal").className=""};
$("doPrint").onclick=function(){window.print()};

load();applyLang();paintCountries();renderRecs();
</script>
</body>
</html>
